<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verification — StudyFree05</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f8fa;color:#15171b}
.card{width:min(520px,92%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:42px;box-shadow:0 18px 50px rgba(0,0,0,.08);text-align:center}
.icon{font-size:52px}.brand{font-weight:900;font-size:28px;margin:10px 0}.msg{color:#69707d;line-height:1.6}
a{display:inline-block;margin-top:22px;padding:13px 18px;border-radius:11px;background:#f4bf00;color:#111;text-decoration:none;font-weight:900}
</style>
</head>
<body><div class="card">
<div class="icon">{% if success %}✅{% else %}⚠️{% endif %}</div>
<div class="brand">StudyFree05</div>
<p class="msg">{{ message }}</p>
{% if success %}<a href="{{ url_for('login') }}">Log In</a>{% else %}<a href="{{ url_for('register') }}">Register Again</a>{% endif %}
</div></body>
</html>
