<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password — StudyFree05</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f8fa;color:#15171b}.card{width:min(460px,92%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:38px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.brand{font-weight:900;font-size:28px;margin-bottom:8px}.sub{color:#69707d;line-height:1.5;margin-bottom:26px}label{display:block;font-weight:700;margin:16px 0 7px}input{width:100%;padding:14px 15px;border:1px solid #d8dce3;border-radius:12px;font-size:16px}button{width:100%;margin-top:24px;padding:15px;border:0;border-radius:12px;background:#f4bf00;color:#111;font-weight:900;font-size:16px;cursor:pointer}.error{padding:12px;border-radius:10px;background:#fff0f0;color:#b42318;margin-bottom:16px}.bottom{text-align:center;margin-top:20px;color:#69707d}.bottom a{color:#111;font-weight:800}
</style></head><body><div class="card"><div class="brand">StudyFree05</div><div class="sub">Enter your account email. We will send a 6-digit code to reset your password.</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required><button type="submit">Send Reset Code</button></form><div class="bottom"><a href="{{ url_for('login') }}">Back to Log in</a></div></div></body></html>
