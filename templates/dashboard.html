<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard — StudyFree05</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f8fa;color:#15171b}.wrap{width:min(1050px,92%);margin:0 auto;padding:60px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:900;font-size:30px}.logout{padding:11px 17px;border:1px solid #ddd;border-radius:10px;text-decoration:none;color:#111;font-weight:800;background:#fff}.hero{margin-top:45px;background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:40px}h1{font-size:42px;margin:0 0 10px}.muted{color:#69707d}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:24px}.card a{display:block;text-decoration:none;color:#111;font-weight:900;margin-top:12px}@media(max-width:700px){.cards{grid-template-columns:1fr}.hero{padding:28px}h1{font-size:34px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">StudyFree05</div><a class="logout" href="{{ url_for('logout') }}">Log out</a></div><section class="hero"><h1>Welcome, {{ user["full_name"] }}</h1><p class="muted">Your StudyFree05 learning dashboard is ready.</p><div class="cards"><div class="card"><strong>AI Quiz</strong><a href="{{ url_for('ai_quiz') }}">Start a Quiz →</a></div><div class="card"><strong>Progress</strong><p class="muted">Coming next.</p></div><div class="card"><strong>Saved Learning</strong><p class="muted">Coming next.</p></div></div></section></div></body></html>
