<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verify Email — StudyFree05</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:#f7f8fa;color:#15171b}.card{width:min(520px,92%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:42px;box-shadow:0 18px 50px rgba(0,0,0,.08);text-align:center}.brand{font-weight:900;font-size:28px;margin:10px 0}.sub{color:#69707d;line-height:1.6}.email{font-weight:900;margin:16px 0;word-break:break-all}input{width:100%;padding:15px;border:1px solid #d8dce3;border-radius:12px;font-size:24px;text-align:center;letter-spacing:8px}button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:#f4bf00;color:#111;font-weight:900;font-size:16px;cursor:pointer}.resend{background:#fff;border:1px solid #d8dce3}.error{padding:12px;border-radius:10px;background:#fff0f0;color:#b42318;margin-bottom:16px}
</style></head><body><div class="card"><div class="brand">Verify your email</div><p class="sub">Enter the 6-digit code sent to:</p><div class="email">{{ email }}</div>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="POST"><input name="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required><button type="submit">Verify Email</button></form><form method="POST" action="{{ url_for('resend_verification') }}"><button class="resend" type="submit">Resend Code</button></form><p class="sub">The code expires in 10 minutes.</p></div></body></html>
